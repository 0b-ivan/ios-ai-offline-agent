name: iOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild             -project ObiAgent.xcodeproj             -target ObiAgent             -configuration Debug             -sdk iphonesimulator             CODE_SIGNING_ALLOWED=NO             build
