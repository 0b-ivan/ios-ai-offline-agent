name: iOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project ObiAgent.xcodeproj \
            -target ObiAgent \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Unit tests
        run: |
          set -o pipefail

          DEVICE_ID="$(
            python3 <<'PY'
          import json
          import subprocess

          payload = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          )

          candidates = []
          for runtime, devices in payload["devices"].items():
              if "iOS-26" not in runtime:
                  continue
              for device in devices:
                  if device["name"].startswith("iPhone"):
                      candidates.append(device["udid"])

          if not candidates:
              raise SystemExit("No available iOS 26 iPhone simulator found.")

          print(candidates[0])
          PY
          )"

          echo "Using simulator: $DEVICE_ID"

          xcodebuild \
            -project ObiAgent.xcodeproj \
            -scheme ObiAgent \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
